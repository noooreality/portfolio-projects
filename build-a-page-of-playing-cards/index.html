<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link href="styles.css" rel="stylesheet">
</head>

<body>
  <main id="playing-cards">
    <div class="card A">
      <div class="left"><div>A</div>♠</div>
      <div class="middle">♠</div>
      <div class="right"><div>A</div>♠</div>
    </div>
    <div class="card K">
      <div class="left"><div>K</div>♣</div>
      <div class="middle">♣</div>
      <div class="right"><div>K</div>♣</div>
    </div>
    <div class="card Q">
      <div class="left"><div>Q</div>♥</div>
      <div class="middle">♥</div>
      <div class="right"><div>Q</div>♥</div>
    </div>
  </main>
</body>

</html>
