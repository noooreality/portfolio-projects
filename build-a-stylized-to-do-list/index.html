<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>My To-Do List</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <h1>My To-Do List</h1>
    <ul class="todo-list">
        <li>
            <input id="todo-1" type="checkbox">
            <label for="todo-1">Buy groceries</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.walmart.com/" target="_blank">Grocery shopping list</a></li>
            </ul>
        </li>
        <li>
            <input id="todo-2" type="checkbox">
            <label for="todo-2">Finish homework</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.khanacademy.org/" target="_blank">Math resources</a></li>
            </ul>
        </li>
        <li>
            <input id="todo-3" type="checkbox">
            <label for="todo-3">Call Mom</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://calendar.google.com/" target="_blank">Schedule reminder</a></li>
            </ul>
        </li>
        <li>
            <input id="todo-4" type="checkbox">
            <label for="todo-4">Plan weekend trip</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.booking.com/" target="_blank">Book a hotel</a></li>
            </ul>
        </li>
    </ul>
</body>
</html>
