<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: auto;
            padding: 20px;
            background-color: #f8f8f8;
        }

        section {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        img {
            width: 150px;
            height: auto;
        }

        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #218838;
        }

        .price {
            font-size: 1.2em;
        }
    </style>
</head>

<body>
    <h1>Checkout</h1>

    <section>
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="Rubik's Cube" />
        <p>Cubic Rubik</p>
        <p class="price">
            <s style="color: grey;">9.99$</s>
            <span style="color: red; font-weight: bold;">4.99$</span>
        </p>
    </section>

    <section>
        <h2>Payment Information</h2>
        <form>
            <label for="card-name">Cardholder Name</label>
            <input required aria-required="true" placeholder="Ex. John Doe" id="card-name" name="card-name" />

            <label for="card-number">Card Number</label>
            <input required aria-required="true" placeholder="1111 1111 1111 1111" id="card-number" name="card-number" maxlength="16" pattern="\d{16}" title="Card number must be 16 digits" />

            <label for="expiry-month">Expiry Date</label>
            <div style="display: flex; gap: 10px;">
                <select id="expiry-month" name="expiry-month" required>
                    <option value="">Month</option>
                    <option value="01">01</option>
                    <option value="02">02</option>
                    <option value="03">03</option>
                    <option value="04">04</option>
                    <option value="05">05</option>
                    <option value="06">06</option>
                    <option value="07">07</option>
                    <option value="08">08</option>
                    <option value="09">09</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                </select>
                <select id="expiry-year" name="expiry-year" required>
                    <option value="">Year</option>
                    <option value="2025">2025</option>
                    <option value="2026">2026</option>
                    <option value="2027">2027</option>
                    <option value="2028">2028</option>
                    <option value="2029">2029</option>
                    <option value="2030">2030</option>
                </select>
            </div>

            <label for="cvv">CVV</label>
            <input required placeholder="123" type="number" id="cvv" name="cvv" min="000" max="999" />

            <button type="submit" id="submit">Place Order</button>
        </form>
    </section>
</body>

</html>
